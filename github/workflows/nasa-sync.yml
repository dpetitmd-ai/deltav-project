name: Auto-Sync NASA Mars Data (Delta-V Project)

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón cuando quieras

permissions:
  contents: write

jobs:
  update-mars-data:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio Delta-V Project
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Ejecutar script de conexión con la NASA
        run: python sync_nasa.py

      - name: 4. Guardar nuevos datos de la NASA en el repositorio
        run: |
          git config --global user.name "Delta-V NASA AutoBot"
          git config --global user.email "bot@deltavproject.org"
          git add nasa_live_data.geojson
          git diff --staged --quiet || git commit -m "🛰️ Auto-update NASA Mars telemetry & waypoints"
          git push
